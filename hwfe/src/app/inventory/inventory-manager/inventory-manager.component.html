<div class="flex flex-row items-start gap-3">
  <app-gear-manager
    [gear]="inventory().gear"
    [showUnequip]="this.showUnequip()"
    [canUnequip]="this.canUnequip()"
    [unequip]="this.unequip"
  ></app-gear-manager>
  <div class="h-[404px] separator-l separator-secondary"></div>
  <app-backpack-manager
    [backpack]="inventory().backpack"
    [showEquip]="this.showEquip()"
    [canEquip]="this.canEquip()"
    [equip]="this.equip"
    class="grow"
  ></app-backpack-manager>
</div>
