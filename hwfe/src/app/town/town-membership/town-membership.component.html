<app-card
  [actions]="actions()"
  [color]="membership().me ? 'primary' : 'secondary'"
  [miniactions]="miniactions()"
>
  <div appCardTitle>
    <div class="flex flex-row justify-between items-center">
      <app-who-character [user]="membership().user" [character]="character()"></app-who-character>

      <div class="flex flex-row justify-end items-center gap-hw-average grow">
        <div class="typ-h2">BP 8</div>
        <div class="typ-h2">|</div>
        <div class="typ-h2">MP 4</div>
      </div>
    </div>
  </div>

  <div appCardBody class="flex flex-col gap-hw-average">
    <app-inventory-manager
      [inventory]="inventory()"
      [showEquip]="membership().me"
      [canEquip]="true"
      (equip)="onEquip($event)"
      [showUnequip]="membership().me"
      [canUnequip]="true"
      (unequip)="onUnequip($event)"
      [showDrop]="membership().me"
      [canDrop]="true"
      (drop)="onDrop($event)"
      [showSellItem]="membership().me"
      [canSellItem]="true"
      (sellItem)="onSellItem($event)"
    ></app-inventory-manager>
  </div>
</app-card>
