# Hot Wizards stack: 3 containers from 3 images.
#   db   - official postgres image (pulled, not built)
#   hwbe - NestJS backend (built from hwbe/Dockerfile)
#   hwfe - nginx serving the Angular build (built from hwfe/Dockerfile)
#
# Configuration comes from a .env file next to this compose file.
# On the droplet that file is generated by the GitHub Actions deploy workflow.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HWBE_DB_USER}
      POSTGRES_PASSWORD: ${HWBE_DB_PASSWORD}
      POSTGRES_DB: ${HWBE_DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  hwbe:
    image: ghcr.io/gatperdut/hotwizards-hwbe:latest
    build:
      context: .
      dockerfile: hwbe/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  hwfe:
    image: ghcr.io/gatperdut/hotwizards-hwfe:latest
    build:
      context: .
      dockerfile: hwfe/Dockerfile
    restart: unless-stopped
    ports:
      # Only reachable from the droplet itself; host nginx terminates TLS and proxies here.
      - '127.0.0.1:8080:80'
    depends_on:
      - hwbe

volumes:
  db-data:
