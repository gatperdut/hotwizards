<div class="flex flex-row items-start gap-3">
  <app-gear-manager
    [gear]="inventory().gear"
    [showUnequip]="showUnequip()"
    [canUnequip]="canUnequip()"
    [unequip]="unequip"
  ></app-gear-manager>
  <div class="h-[404px] separator-l separator-secondary"></div>
  <app-backpack-manager
    [backpack]="inventory().backpack"
    [showEquip]="showEquip()"
    [canEquip]="canEquip()"
    [equip]="equip"
    [showDrop]="showDrop()"
    [canDrop]="canDrop()"
    [drop]="drop"
    [showSellItem]="showSellItem()"
    [canSellItem]="canSellItem()"
    [sellItem]="sellItem"
    class="grow"
  ></app-backpack-manager>
</div>
