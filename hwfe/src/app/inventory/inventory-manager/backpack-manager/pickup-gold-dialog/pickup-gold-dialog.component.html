<form [formRoot]="form">
  <app-dialog sizeClass="max-w-md">
    <ng-template appDialogTitle>
      <div class="typ-h2">Take gold from stash</div>
    </ng-template>

    <ng-template appDialogContent>
      <div class="flex flex-col gap-hw-average">
        <div class="typ-body">
          There are {{ data.amount }} gold coins in the stash. Take how many?
        </div>
        <app-input-text
          [field]="form"
          label="Gold coins to take"
          type="number"
          placeholder="Amount"
        ></app-input-text>
      </div>
    </ng-template>

    <ng-template appDialogActions>
      <app-button
        label="Cancel"
        type="button"
        (click)="dialogRef.close()"
        appearance="outlined"
      ></app-button>
      <app-button
        label="Take all"
        type="button"
        (click)="dialogRef.close(data.amount)"
        appearance="outlined"
      ></app-button>
      <app-button label="Take" type="submit" [disabled]="form().invalid()"></app-button
    ></ng-template>
  </app-dialog>
</form>
