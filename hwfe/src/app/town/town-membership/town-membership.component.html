<app-card
  [actions]="actions()"
  [color]="membership().me ? 'primary' : 'secondary'"
  [miniactions]="miniactions()"
>
  <div appCardTitle>
    <div class="flex flex-row justify-between items-center gap-1">
      <app-who-character [user]="membership().user" [character]="character()"></app-who-character>

      <div class="flex flex-col leading-3.5">
        <div class="flex flex-row justify-between gap-1">
          <span class="text-primary">BP</span>
          <span class="text-primary">{{ bodyPoints() }}</span>
        </div>
        <div class="flex flex-row justify-between gap-1">
          <span class="text-secondary">MP</span>
          <span class="text-secondary">{{ mindPoints() }}</span>
        </div>
        <div class="flex flex-row justify-between gap-1">
          <span class="text-off-medium">MP</span>
          <span class="text-off-medium">{{ movementPoints() }}</span>
        </div>
        <div class="flex flex-row justify-between gap-1">
          <span class="text-warning">AD</span>
          <span class="text-warning">{{ attackDie() }}</span>
        </div>
        <div class="flex flex-row justify-between gap-1">
          <span class="text-off-light">DD</span>
          <span class="text-off-light">{{ defendDie() }}</span>
        </div>
      </div>
    </div>
  </div>

  <div appCardBody class="flex flex-col gap-hw-average">
    <app-inventory-manager
      [inventory]="inventory()"
      [showEquip]="membership().me"
      [canEquip]="true"
      (equip)="onEquip($event)"
      [showUnequip]="membership().me"
      [canUnequip]="true"
      (unequip)="onUnequip($event)"
      [showDrop]="membership().me"
      [canDrop]="true"
      (drop)="onDrop($event)"
      [showSellItem]="membership().me"
      [canSellItem]="true"
      (sellItem)="onSellItem($event)"
      [showGiveGold]="!master().me && !membership().me"
      [canGiveGold]="!master().me && myCharacter()!.inventory.backpack.gold > 0"
      (giveGold)="onGiveGold($event)"
      [showDestroyItem]="membership().me"
      [canDestroyItem]="true"
      (destroyItem)="onDestroyItem($event)"
    ></app-inventory-manager>
  </div>
</app-card>
